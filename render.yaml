# ============================================================
# Render Blueprint Specification
# https://render.com/docs/blueprint-spec
# ============================================================

services:
  # ----------------------------------------------------------
  # Backend API Web Service
  # ----------------------------------------------------------
  - type: web
    name: ai-resume-analyzer-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python setup_nltk.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  # ----------------------------------------------------------
  # Frontend Static Site
  # ----------------------------------------------------------
  - type: web
    name: ai-resume-analyzer-frontend
    runtime: static
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
